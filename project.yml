# XcodeGen project definition. Regenerate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# The generated .xcodeproj is also tracked for ready-to-open Mac downloads.
name: CranfordHistoricalAR

options:
  bundleIdPrefix: com.cranford
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# Debug/Release.xcconfig include Base.xcconfig and *optionally* Secrets.xcconfig (gitignored).
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  # Google Maps SDK for iOS — SPM is Google's recommended install method (CocoaPods deprecated in 11.0).
  # Pin an exact version per Google's guidance for new projects.
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.1.0
  # Platform-independent tour logic, unit-tested on Linux/macOS with `swift test`.
  TourCore:
    path: Packages/TourCore
  # ARCore Geospatial (SPM since 1.36.0). Latest checked 2026-10-12: 1.56.0.
  # Runtime still requires ENABLE_ARCORE_GEOSPATIAL=1, an ARCore API key, precise location,
  # network, device support, and first-run consent. Google's install rule is "Up to Next Minor".
  ARCore:
    url: https://github.com/google-ar/arcore-ios-sdk
    minorVersion: 1.56.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    CLANG_MODULES_AUTOLINK: "YES"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    # Required by ARCore (harmless otherwise); keeps the ARCore opt-in a one-line change.
    OTHER_LDFLAGS: "$(inherited) -ObjC"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  CranfordHistoricalAR:
    type: application
    platform: iOS
    sources:
      - path: CranfordHistoricalAR
        excludes:
          - "Info.plist"
      - path: assets/audio/stops/stop_01_droeschers_mill.mp3
        buildPhase: resources
      - path: assets/audio/stops/stop_02_greystone.mp3
        buildPhase: resources
    settings:
      base:
        # Must match Info.plist CFBundleIdentifier and the iOS-app restriction on the Google API key.
        # An empty value is what Google reports as "iOS client application <empty>" and blocks Routes/Maps.
        PRODUCT_BUNDLE_IDENTIFIER: com.cranford.historicalar
        # Keep PRODUCT_NAME free of spaces so XcodeGen's generated TEST_HOST path is valid;
        # the user-facing name comes from CFBundleDisplayName in Info.plist.
        PRODUCT_NAME: CranfordHistoricalAR
        INFOPLIST_FILE: CranfordHistoricalAR/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "74"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
        SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: UIInterfaceOrientationPortrait
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(APP_COMPILATION_CONDITIONS)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DEVELOPER_MENU $(APP_COMPILATION_CONDITIONS)"
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: TourCore
        product: TourCore
      - package: ARCore
        product: ARCoreGeospatial
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: MapKit.framework
      - sdk: Network.framework
    scheme:
      gatherCoverageData: false
      testTargets:
        - CranfordHistoricalARTests
      environmentVariables:
        # Silences the unified-logging noise the Simulator prints on every launch
        # ("cannot add handler to 0 from 0 - dropping", "Failed to send CA Event…",
        # "non-launching port is incompatible with … com.apple.PointerUI…"). Off by default
        # because it also hides Google Maps SDK / Core Location diagnostics you want while
        # setting up API keys. Tick it in Edit Scheme ▸ Run ▸ Arguments, or set isEnabled: true.
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false

  # Host-app unit tests (view-model flows that need CoreLocation/UIKit types). Run on a Mac with
  # Product > Test; the platform-independent logic is covered by Packages/TourCore on any OS.
  CranfordHistoricalARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CranfordHistoricalARTests
    dependencies:
      - target: CranfordHistoricalAR
      - package: TourCore
        product: TourCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cranford.historicalar.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DEVELOPER_MENU"
