# XcodeGen project definition. Regenerate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is intentionally not committed (see .gitignore).
name: CranfordHistoricalAR

options:
  bundleIdPrefix: com.cranford
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# Debug/Release.xcconfig include Base.xcconfig and *optionally* Secrets.xcconfig (gitignored).
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  # Google Maps SDK for iOS — SPM is Google's recommended install method (CocoaPods deprecated in 11.0).
  # Pin an exact version per Google's guidance for new projects.
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.1.0
  # Platform-independent tour logic, unit-tested on Linux/macOS with `swift test`.
  TourCore:
    path: Packages/TourCore
  # OPTIONAL — ARCore Geospatial. Not linked by default (spec §15: must not block the MVP).
  # To enable: uncomment this package, the `ARCoreGeospatial` dependency below, and set
  # ENABLE_ARCORE_GEOSPATIAL=1 in Secrets.xcconfig. Also enable the "ARCore API" in Google Cloud.
  # ARCore:
  #   url: https://github.com/google-ar/arcore-ios-sdk
  #   minorVersion: 1.56.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    # Required by ARCore (harmless otherwise); keeps the ARCore opt-in a one-line change.
    OTHER_LDFLAGS: "$(inherited) -ObjC"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  CranfordHistoricalAR:
    type: application
    platform: iOS
    sources:
      - path: CranfordHistoricalAR
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cranford.historicalar
        PRODUCT_NAME: Cranford Historical AR
        INFOPLIST_FILE: CranfordHistoricalAR/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
        SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: UIInterfaceOrientationPortrait
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(APP_COMPILATION_CONDITIONS)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DEVELOPER_MENU $(APP_COMPILATION_CONDITIONS)"
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: TourCore
        product: TourCore
      # - package: ARCore
      #   product: ARCoreGeospatial
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
    scheme:
      gatherCoverageData: false
