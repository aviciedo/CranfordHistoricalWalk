name: Apple compiler checks

on:
  push:
    branches: [main]
    paths:
      - 'CranfordHistoricalAR/**'
      - 'CranfordHistoricalARTests/**'
      - 'CranfordHistoricalAR.xcodeproj/**'
      - 'Packages/TourCore/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/apple-build.yml'
  pull_request:
    paths:
      - 'CranfordHistoricalAR/**'
      - 'CranfordHistoricalARTests/**'
      - 'CranfordHistoricalAR.xcodeproj/**'
      - 'Packages/TourCore/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/apple-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Report native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test TourCore on Apple Foundation and CoreGraphics
        run: swift test --package-path Packages/TourCore
      - name: Compile the shipped Xcode project and tests for Simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/apple-verification
          xcodebuild -project CranfordHistoricalAR.xcodeproj \
            -scheme CranfordHistoricalAR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/apple-verification/simulator \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee .build/apple-verification/simulator.log
      - name: Compile Release for iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project CranfordHistoricalAR.xcodeproj \
            -scheme CranfordHistoricalAR -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/apple-verification/device \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/apple-verification/device.log
      - name: Preserve compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-compiler-logs
          path: .build/apple-verification/*.log
          if-no-files-found: ignore
          retention-days: 7
