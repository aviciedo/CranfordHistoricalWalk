name: Apple compiler checks

on:
  push:
    # Published branches share one commit. Test main once; PRs and manual runs remain enabled.
    branches: [main]
    paths:
      - 'CranfordHistoricalAR/**'
      - 'CranfordHistoricalARTests/**'
      - 'CranfordHistoricalAR.xcodeproj/**'
      - 'Packages/TourCore/**'
      - 'Config/**'
      - 'assets/audio/**'
      - 'project.yml'
      - '.github/workflows/apple-build.yml'
      - 'scripts/summarize-apple-checks.py'
  pull_request:
    paths:
      - 'CranfordHistoricalAR/**'
      - 'CranfordHistoricalARTests/**'
      - 'CranfordHistoricalAR.xcodeproj/**'
      - 'Packages/TourCore/**'
      - 'Config/**'
      - 'assets/audio/**'
      - 'project.yml'
      - '.github/workflows/apple-build.yml'
      - 'scripts/summarize-apple-checks.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Report native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test TourCore on Apple Foundation and CoreGraphics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/apple-verification
          swift test --package-path Packages/TourCore 2>&1 | tee .build/apple-verification/core.log
      - name: Compile the shipped Xcode project and tests for Simulator
        id: simulator-build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/apple-verification
          xcodebuild -project CranfordHistoricalAR.xcodeproj \
            -scheme CranfordHistoricalAR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/apple-verification/simulator \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee .build/apple-verification/simulator.log
      - name: Execute native tests on an available iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')
          xcodebuild -project CranfordHistoricalAR.xcodeproj \
            -scheme CranfordHistoricalAR -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath .build/apple-verification/simulator \
            -resultBundlePath .build/apple-verification/native-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee .build/apple-verification/native-tests.log
      - name: Compile Release for iPhone
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project CranfordHistoricalAR.xcodeproj \
            -scheme CranfordHistoricalAR -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/apple-verification/device \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/apple-verification/device.log
      - name: Summarize Apple build and test failures
        if: always()
        run: python3 scripts/summarize-apple-checks.py
      - name: Preserve compiler logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apple-compiler-logs
          path: |
            .build/apple-verification/*.log
            .build/apple-verification/diagnostics.md
            .build/apple-verification/*.xcresult
            CranfordHistoricalAR.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
