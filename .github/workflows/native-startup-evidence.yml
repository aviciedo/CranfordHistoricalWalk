name: Retained native startup evidence
on:
  push:
    branches: [validation/startup-evidence]
    paths: [.github/workflows/native-startup-evidence.yml, scripts/report-startup-crash.py]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: apple-compiler-logs
          run-id: 41240318142
          github-token: ${{ github.token }}
          path: .build/startup-failure
      - run: python3 scripts/report-startup-crash.py .build/startup-failure
